services:
  - type: web
    name: mini-crm-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # CLIENT_URL is optional during initial deployment. Add it in the Render
      # dashboard under Environment after the frontend (e.g. Vercel) URL is known.
